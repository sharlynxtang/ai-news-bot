name: Daily AI News Report

on:
  push:
    branches: [codex/catch-up-2026-10-12]
  workflow_dispatch:  # Triggered daily at 11:00 Asia/Singapore by an external scheduler.

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::FEISHU_WEBHOOK_URL is missing from GitHub Actions secrets"
            exit 1
          fi
          python scripts/check_feishu_webhook.py
          if python main.py > /tmp/ai-news-report.txt 2> /tmp/ai-news-error.txt; then
            echo "::notice::Full AI news report delivered"
          else
            python scripts/catch_up_fallback.py /tmp/ai-news-report.txt /tmp/ai-news-error.txt
          fi
