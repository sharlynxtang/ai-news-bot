name: Daily AI News Report

on:
  schedule:
    - cron: '30 2 * * *'  # UTC 2:30 = CST (北京时间) 10:30
  workflow_dispatch:        # 手动触发

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Bot
        # `|| true` 保证即使脚本非零退出也不让整个 workflow crash；
        # 详细错误已由 main.py 打到 stderr，可在 Actions 日志中查看。
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python main.py || echo "::warning::main.py exited non-zero — check logs above"
