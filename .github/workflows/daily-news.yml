name: Daily AI News Report

on:
  workflow_dispatch:  # Triggered daily at 11:00 Asia/Singapore by an external scheduler.

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::error::FEISHU_WEBHOOK_URL is missing from GitHub Actions secrets"
            exit 1
          fi
          case "$FEISHU_WEBHOOK_URL" in
            open.feishu.cn/open-apis/bot/v2/hook/*|open.larksuite.com/open-apis/bot/v2/hook/*)
              FEISHU_WEBHOOK_URL="https://$FEISHU_WEBHOOK_URL"
              ;;
            http://open.feishu.cn/open-apis/bot/v2/hook/*|http://open.larksuite.com/open-apis/bot/v2/hook/*)
              FEISHU_WEBHOOK_URL="https://${FEISHU_WEBHOOK_URL#http://}"
              ;;
          esac
          if [[ "$FEISHU_WEBHOOK_URL" =~ ^[0-9a-fA-F-]{32,}$ ]]; then
            FEISHU_WEBHOOK_URL="https://open.feishu.cn/open-apis/bot/v2/hook/$FEISHU_WEBHOOK_URL"
          fi
          export FEISHU_WEBHOOK_URL
          python main.py
